name: "Release"

# Thin caller. The implementation lives in plentific/github-actions so that a
# fix lands once rather than in every library repository. See ADR-0035.

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO before merge: repin to the tag cut from plentific/github-actions#1.
      - uses: plentific/github-actions/actions/backend_libraries/release@rse/backend-libraries-workflows
