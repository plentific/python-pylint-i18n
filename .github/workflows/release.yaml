name: "Release"

# Thin caller. The implementation lives in plentific/github-actions so that a
# fix lands once rather than in every library repository. See ADR-0035.

on:
  push:
    branches:
      - master

# A called workflow can only narrow these, never widen them, so the write
# access the release needs has to be granted here.
permissions:
  contents: write

jobs:
  release:
    # TODO before merge: repin to the tag cut from plentific/github-actions#1.
    uses: plentific/github-actions/.github/workflows/backend_libraries_release.yml@rse/backend-libraries-workflows
