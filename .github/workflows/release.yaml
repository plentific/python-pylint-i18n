name: "Release"

# On merge to master, tag the declared version and publish a GitHub release,
# so the tag is a product of the merge rather than a manual step. See ADR-0035.

on:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  # Tag names in this repository are the declared version with this prefix.
  TAG_PREFIX: ""

jobs:
  tag-and-release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the declared version and publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="${TAG_PREFIX}${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::warning::Tag ${tag} already exists, so this push cut no release. That means a commit reached master without bumping the version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

          gh release create "${tag}" --title "${tag}" --generate-notes

          echo "Released ${tag}."
