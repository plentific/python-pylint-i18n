name: "Tag check"

# A version tag must name the version declared at the commit it points to.
# Tags pushed by the Release workflow match by construction and do not
# re-trigger workflows, so in practice this guards hand-cut tags. See ADR-0035.

on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"

env:
  # Tag names in this repository are the declared version with this prefix.
  TAG_PREFIX: ""

jobs:
  tag-matches-version:
    name: Tag matches the declared version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the tag name against the declared version
        run: |
          set -euo pipefail

          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected="${TAG_PREFIX}${version}"

          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the declared version. pyproject.toml at this commit declares ${version}, so the tag should be ${expected}. Delete this tag and cut the release through a PR instead."
            exit 1
          fi

          echo "Tag ${GITHUB_REF_NAME} matches the declared version."
