name: "Version check"

# Thin caller. The implementation lives in plentific/github-actions so that a
# fix lands once rather than in every library repository. See ADR-0035.

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # TODO before merge: repin to the tag cut from plentific/github-actions#1.
      - uses: plentific/github-actions/actions/backend_libraries/version_check@rse/backend-libraries-workflows
